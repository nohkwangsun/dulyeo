name: Android APK

# PRs and branches: build a debug APK you can download from the run page.
# main: build a signed APK and publish it as the rolling "latest" release.
# tags v*: build a signed APK and publish a versioned release.
# Signed builds need the four ANDROID_* secrets (see README, "APK 자동 빌드").

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
      version: ${{ steps.version.outputs.name }}
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/setup-android.mjs') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Decide build mode
        id: mode
        run: |
          # Never sign (or touch secrets) for pull requests.
          if [ "$HAS_KEYSTORE" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute version
        id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="${base}-build.${{ github.run_number }}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # versionCode must only ever go up so phones accept the update.
          echo "DULYEO_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "DULYEO_VERSION_NAME=$name" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build
      - run: npm run android:setup

      - name: Build release APK
        if: steps.mode.outputs.signed == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign release APK
        if: steps.mode.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" scripts/sign-apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            "out/dulyeo-${{ steps.version.outputs.name }}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Build debug APK
        if: steps.mode.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect debug APK
        if: steps.mode.outputs.signed != 'true'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/dulyeo-${{ steps.version.outputs.name }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dulyeo-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Dulyeo ${{ steps.version.outputs.name }}"
            if [ "${{ steps.mode.outputs.signed }}" = "true" ]; then
              echo "Signed release APK built."
            else
              echo "**Debug APK** (signature changes every build, so it cannot update an installed copy)."
              echo "Add the ANDROID_* secrets to get signed, updatable builds: see README."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: >-
      needs.build.outputs.signed == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dulyeo-apk
          path: out

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" "out/dulyeo-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" --title "Dulyeo $VERSION" --generate-notes

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        run: |
          cp "out/dulyeo-$VERSION.apk" out/dulyeo.apk
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest out/dulyeo.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Latest build ($VERSION)" \
            --notes "Built from ${GITHUB_SHA::7} on main. Install over the existing app to update. Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/dulyeo.apk"
